name: CI/CD Pyrenex Prod

on:
  push:
    branches: [main, M5-B2-theo]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install model deps
        run: pip install -r services/model/requirements.txt pytest==8.3.3 httpx==0.28.1
      - name: Tests API model (hors contract test)
        run: pytest -v services/model/tests -k "not model_contract_features_and_output"
      - name: Contract test du modele (gate release)
        run: pytest -v services/model/tests -k "model_contract_features_and_output"

  evaluate-model:
    needs: [tests]
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps (eval continue)
        run: pip install -r requirements-dev.txt
      - name: Tests evaluation continue
        run: pytest -v tests/test_evaluation.py
      - name: Evaluation continue vs golden run
        run: python scripts/evaluate_model.py --release-tag "ci-${{ github.sha }}"
      - name: Alerte Discord (release bloquee)
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -sf -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \":rotating_light: **Release bloquee** — evaluate-model a echoue sur \`${{ github.ref_name }}\` (\`${{ github.sha }}\`).\nDetails : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"

  build-model-image:
    needs: [tests, evaluate-model]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image model
        run: docker build -t pyrenex-model:ci ./services/model

  push-release-tag:
    needs: [tests, build-model-image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image with release tag
        env:
          RAW_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          REPOSITORY_LOWER="$(echo "$RAW_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPOSITORY_LOWER}-model"

          docker build -t "$IMAGE:$TAG" ./services/model
          docker push "$IMAGE:$TAG"
