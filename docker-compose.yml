services:
  model:
    build: ./services/model
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  feedback:
    build: ./services/feedback
    ports:
      - "8002:8002"
    volumes:
      - ./data:/data
      - ./scripts:/scripts:ro
    environment:
      FEEDBACK_DB: /data/feedbacks.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  backend:
    build: ./services/backend
    ports:
      - "8001:8001"
    environment:
      MODEL_URL: http://model:8000
      ALLOWED_ORIGINS: http://localhost:8088,http://127.0.0.1:8088
    depends_on:
      model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build: ./services/frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      model:
        condition: service_healthy
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3001:3000"            # 3001 hôte : évite le conflit 3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
